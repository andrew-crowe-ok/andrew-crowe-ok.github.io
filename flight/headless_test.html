<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Headless WebGL Tests</title>
</head>
<body>
  <canvas id="glcanvas" width="640" height="360"></canvas>
  <div id="shieldFlash" class="wash"></div>
  <div id="warpFlash" class="wash"></div>
  <div id="fade" class="wash"></div>
  <div id="error" role="alert" hidden></div>
  <button id="engageButton">Engage</button>

  <div id="helmHud" hidden>
    <div id="stick" class="touch" role="slider" aria-label="Pitch and yaw"><div id="stickKnob"></div></div>
    <div id="helmPanel">
      <div id="helmReadout">
        <span id="helmMode">Impulse</span>
        <span id="helmSpeed">0.0</span>
        <span id="helmTarget" hidden></span>
      </div>
      <input type="range" id="throttle" aria-label="Throttle" title="Throttle" min="0" max="1" step="0.01" value="0">
      <div id="helmButtons">
        <button id="rollLeft" class="touch" aria-label="Roll left">&#x27F2;</button>
        <button id="warpButton" aria-pressed="false">Warp</button>
        <button id="wingmanButton" aria-pressed="false">Escort</button>
        <button id="audioButton" aria-pressed="true">Audio</button>
        <button id="orbitButton">Orbit</button>
        <button id="rollRight" class="touch" aria-label="Roll right">&#x27F3;</button>
      </div>
      <div id="helmKeys">W S pitch &middot; A D yaw &middot; Q E roll &middot; R F throttle &middot; Space warp &middot; C escort &middot; M mute &middot; Esc orbit</div>
    </div>
  </div>

  <details id="controls" open>
    <summary>Ray tracer</summary>
    <label class="row">Resolution
      <select id="resolution">
        <option value="0" selected>Auto</option>
        <option value="1440">1440p</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="540">540p</option>
        <option value="360">360p</option>
      </select></label>
    <label class="row">FPS cap
      <select id="fps">
        <option value="0" selected>Unlimited</option>
        <option value="120">120</option>
        <option value="60">60</option>
        <option value="30">30</option>
        <option value="20">20</option>
      </select></label>
    <label class="row">Bounces <output for="bounces"></output>
      <input type="range" id="bounces" min="0" max="6" step="1" value="3"></label>
    <label class="row">Sun <output for="sun"></output>
      <input type="range" id="sun" min="0" max="2" step="0.05" value="1"></label>
    <label class="row">Fill light <output for="fill"></output>
      <input type="range" id="fill" min="0" max="4" step="0.05" value="1"></label>
    <label class="row">Nav light <output for="nav"></output>
      <input type="range" id="nav" min="0" max="4" step="0.05" value="1"></label>
    <label class="row">Shininess <output for="shininess"></output>
      <input type="range" id="shininess" min="-2" max="2" step="0.1" value="0"></label>
    <label class="row">Glass index of refraction <output for="ior"></output>
      <input type="range" id="ior" min="1" max="2.4" step="0.01" value="1.5"></label>
    <div class="checks">
      <label><input type="checkbox" id="shadows" checked> Shadows</label>
      <label><input type="checkbox" id="attenuation" checked> Attenuation</label>
      <label><input type="checkbox" id="stats"> Stats</label>
      <label><input type="checkbox" id="invert"> Invert pitch</label>
      <label><input type="checkbox" id="wingmanToggle"> Wingman</label>
      <label><input type="checkbox" id="audioToggle" checked> Sound</label>
    </div>
  </details>

  <div id="statsOverlay" hidden>
    <div class="stats-header">
      <span>Telemetry</span>
      <div style="display: flex; align-items: center; gap: 0.3em;">
        <span id="statsFlightPhase" class="stats-status">ORBIT</span>
        <button id="statsClose" title="Hide stats (key: I)" aria-label="Close stats">&times;</button>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Frame Rate</span>
      <span id="statFps" class="stat-val accent">-- FPS</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Latency / Frame</span>
      <span id="statLatency" class="stat-val">-- ms</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">CPU Render</span>
      <span id="statCpu" class="stat-val">-- ms</span>
    </div>
    <div id="statGpuRow" class="stat-row" hidden>
      <span class="stat-label">GPU Render</span>
      <span id="statGpu" class="stat-val">-- ms</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Resolution</span>
      <span id="statRes" class="stat-val">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Viewport / Scale</span>
      <span id="statScale" class="stat-val">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Primitives</span>
      <span id="statPrims" class="stat-val">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Ray Bounces</span>
      <span id="statBounces" class="stat-val">--</span>
    </div>
    <div id="statEntitiesRow" class="stat-row">
      <span class="stat-label">Entities</span>
      <span id="statEntities" class="stat-val">--</span>
    </div>
    <div id="statTargetRow" class="stat-row" hidden>
      <span class="stat-label">Escort Target</span>
      <span id="statTarget" class="stat-val">--</span>
    </div>
    <canvas id="statsGraph" class="stats-graph" width="200" height="28"></canvas>
    <div id="statsGpuInfo" class="stats-gpu-info"></div>
  </div>

  <pre id="out"></pre>
  <pre id="errors"></pre>

  <script>
  window.scriptErrors = [];
  window.addEventListener('error', e => {
    if (e.target && e.target !== window) return;
    window.scriptErrors.push(e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno);
    document.getElementById('errors').textContent = window.scriptErrors.join('\n');
  });
  </script>
  <script src="transforms.js"></script>
  <script src="textures.js"></script>
  <script src="raytrace.js"></script>
  <script src="ship.js"></script>
  <script src="camera.js"></script>
  <script src="audio.js"></script>
  <script src="scene.js"></script>
  <script src="world.js"></script>
  <script src="main.js"></script>
  <script>
  const out = [];
  const check = (name, ok, detail = "") => out.push(`${ok ? "PASS" : "FAIL"} ${name} ${detail}`);
  const near = (a, b, eps = 1e-4) => a.every((v, i) => Math.abs(v - b[i]) < eps);

  async function runTests() {
    try {
      if (window.assetsReady && window.assetsReady.length > 0) {
        await Promise.all(window.assetsReady);
      }

      // 1. Prototype models initialized
      check("models: GALAXY_MODEL exists", !!window.GALAXY_MODEL && window.GALAXY_MODEL.primCount === 30);
      check("models: PLANET_MODEL exists", !!window.PLANET_MODEL && window.PLANET_MODEL.primCount === 1);
      check("models: MOON_MODEL exists", !!window.MOON_MODEL && window.MOON_MODEL.primCount === 1);
      check("models: total prototype prims = 32", scene.count === 32);
      check("models: total prototype groups = 4", scene.groupCount === 4);

      // 2. Uniform buffer size and binding
      const sceneBlockIdx = gl.getUniformBlockIndex(program, "Scene");
      check("ubo: Scene block found", sceneBlockIdx !== gl.INVALID_INDEX);
      const uboSize = gl.getActiveUniformBlockParameter(program, sceneBlockIdx, gl.UNIFORM_BLOCK_DATA_SIZE);
      check("ubo: size is 5824 bytes", uboSize === 5824, `actual: ${uboSize}`);
      check("ubo: sceneBytes matches uboSize", sceneBytes.byteLength === uboSize);

      // 3. uInstCount uniform exists
      const uInstLoc = gl.getUniformLocation(program, "uInstCount");
      check("uniforms: uInstCount exists", uInstLoc !== null);

      // 4. Instance adding and capping
      scene.instCount = 0;
      addInstance(PLANET_MODEL, identity());
      addInstance(MOON_MODEL, identity());
      addInstance(GALAXY_MODEL, identity());
      check("instances: instCount is 3", scene.instCount === 3);

      let threwMax = false;
      try {
        for (let i = scene.instCount; i < 20; i++) {
          addInstance(GALAXY_MODEL, identity());
        }
      } catch (err) {
        threwMax = true;
      }
      check("instances: throws on exceeding MAX_INSTANCES (8)", threwMax && scene.instCount === 8);

      // 5. Test rendering frame
      resetScene(0);
      const frame0 = stepFrame(0.016, 0.016);
      buildScene(frame0, false);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const err0 = gl.getError();
      check("webgl: drawArrays NO_ERROR", err0 === gl.NO_ERROR, `err: ${err0}`);

      const pixel = new Uint8Array(4);
      gl.readPixels(320, 180, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      check("webgl: readPixels non-zero alpha", pixel[3] === 255, `rgba: ${Array.from(pixel).join(",")}`);

      // 6. Test multi-ship scene rendering
      resetWorld();
      const w1 = addEntity({ model: "galaxy", rail: companionOrbitPose(-0.5) });
      const w2 = addEntity({ model: "galaxy", rail: companionOrbitPose(0.5) });
      check("world: 3 entities in world", world.entities.length === 3);
      const frameMulti = stepFrame(1.0, 0.016);
      buildScene(frameMulti, false);
      check("scene: 5 instances added (planet, moon, 3 ships)", scene.instCount === 5, `actual: ${scene.instCount}`);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      check("webgl: multi-ship drawArrays NO_ERROR", gl.getError() === gl.NO_ERROR);

      // 7. Test free flight with multi-entity
      requestEngage();
      const frameFly = stepFrame(1.1, 0.1);
      buildScene(frameFly, false);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      check("webgl: free flight multi-ship drawArrays NO_ERROR", gl.getError() === gl.NO_ERROR);

      // 8. Test entity without controller under free flight
      const idleEntity = addEntity({ model: "galaxy", rail: null, controller: null, pos: [1, 2, 3] });
      let idleSafe = true;
      try {
        stepFrame(1.2, 0.1);
      } catch (e) {
        idleSafe = false;
        console.error(e);
      }
      check("robustness: entity without controller survives free flight step", idleSafe);

      // 9. Test wingman toggle
      resetScene(0);
      check("toggleWingman: initial entities is 1", world.entities.length === 1);
      toggleWingman();
      check("toggleWingman: companion added", world.entities.length === 2 && world.entities[1].role === "wingman");
      toggleWingman();
      check("toggleWingman: companion removed", world.entities.length === 1);

      // 10. Test AI Wingman formation & rendering under WebGL free flight
      resetScene(0);
      toggleWingman();
      requestEngage();
      const frameEngage = stepFrame(0.5, 0.016);
      buildScene(frameEngage, false);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      check("webgl: wingman engage drawArrays NO_ERROR", gl.getError() === gl.NO_ERROR);
      check("ai: wingman active and flown", world.entities.length === 2 && world.entities[1].controller === wingmanController && !world.entities[1].rail);

      // 11. Test HUD & Telemetry updates with wingman
      updateHud(frameEngage.ship);
      check("hud: wingman button reflects active state", document.getElementById("wingmanButton").getAttribute("aria-pressed") === "true");
      check("hud: wingman target text rendered", document.getElementById("helmTarget").textContent.includes("TGT"));

      // 12. Test companion persistence across orbit resets
      resetScene(1.0);
      check("resetScene: companion preserved in orbit when toggle active", world.entities.length === 2 && !!world.entities[1].rail);

      // 13. Test preset query handling (?wingman)
      presets.set("wingman", "1");
      document.getElementById("wingmanToggle").checked = false;
      resetScene(1.5);
      check("presets: ?wingman spawns companion in orbit", world.entities.length === 2 && document.getElementById("wingmanToggle").checked);
      presets.delete("wingman");

      // 14. Test Patrol Controller AI rendering in WebGL scene
      resetWorld();
      requestEngage();
      const pShip = addEntity({
        model: "galaxy",
        rail: null,
        controller: createPatrolController({ waypoints: [[12, 0, 0], [0, 12, 0]], speed: 0.7 }),
        pos: [12, 0, -4],
        quat: [0, 0, 0, 1]
      });
      const framePatrol = stepFrame(0.5, 0.016);
      buildScene(framePatrol, false);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      check("webgl: patrol AI drawArrays NO_ERROR", gl.getError() === gl.NO_ERROR);

      // 14b. Robustness: instance capping in drawEntities prevents MAX_INSTANCES throw
      for (let i = 0; i < 10; i++) {
        addEntity({ model: "galaxy", rail: null, pos: [15 + i * 2, 0, 0] });
      }
      let overflowSafe = true;
      try {
        const frameOverflow = stepFrame(0.6, 0.016);
        buildScene(frameOverflow, false);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      } catch (e) {
        overflowSafe = false;
      }
      check("robustness: excess entities capped at MAX_INSTANCES without crash", overflowSafe && scene.instCount === 8);
      check("webgl: capped drawArrays NO_ERROR", gl.getError() === gl.NO_ERROR);

      // 15. KeyC toggles escort companion in orbit mode
      document.getElementById("wingmanToggle").checked = false;
      resetScene(0);
      check("keyc-orbit: initial entities 1", world.entities.length === 1);
      window.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyC" }));
      check("keyc-orbit: KeyC spawns escort in orbit", world.entities.length === 2 && world.entities[1].role === "wingman");
      window.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyC" }));
      check("keyc-orbit: KeyC removes escort in orbit", world.entities.length === 1);

      // 16. Wingman toggle preserves other non-player entities
      resetWorld();
      requestEngage();
      const pEnt = addEntity({ model: "galaxy", rail: null, role: "patrol", pos: [10, 0, 0] });
      check("entities: player + patrol", world.entities.length === 2);
      toggleWingman();
      check("toggleWingman: wingman added alongside patrol", world.entities.length === 3);
      toggleWingman();
      check("toggleWingman: wingman removed, patrol preserved", world.entities.length === 2 && world.entities.includes(pEnt));

      // 17. Steady-state zero Float32Array allocations in WebGL scene building & entity drawing
      resetScene(0);
      toggleWingman();
      requestEngage();
      const fWarm = stepFrame(1.0, 0.016);
      for (let i = 0; i < 5; i++) {
        buildScene(fWarm, false);
      }
      let buildF32 = 0;
      const OrigF32 = window.Float32Array;
      window.Float32Array = function(...args) {
        buildF32++;
        return new OrigF32(...args);
      };
      window.Float32Array.prototype = OrigF32.prototype;
      try {
        for (let i = 0; i < 30; i++) {
          buildScene(fWarm, false);
        }
      } finally {
        window.Float32Array = OrigF32;
      }
      check("steady-state: zero Float32Array allocations in 30 buildScene passes", buildF32 === 0, `allocated: ${buildF32}`);

      // 18. Procedural Audio Engine presence and headless safety
      resetScene(0);
      check("audio: audioEngine exists on window", !!window.audioEngine);
      const aParams = window.audioEngine.getParams();
      check("audio: getParams returns valid bounds", aParams && typeof aParams.engineFreq === "number");
      check("audio: initial idle engine hum bounds", aParams.engineFreq >= 45 && aParams.engineFreq <= 90 && aParams.engineGain > 0);

      // 19. Audio UI controls and mute toggle
      const audioBtn = document.getElementById("audioButton");
      const audioChk = document.getElementById("audioToggle");
      check("audio-ui: audioButton and audioToggle exist in DOM", !!audioBtn && !!audioChk);
      const wasMuted = window.audioEngine.isMuted();
      window.audioEngine.setMuted(true);
      check("audio: setMuted true updates state and volume", window.audioEngine.isMuted() && window.audioEngine.getParams().masterVolume === 0);
      check("audio-ui: audioButton aria-pressed reflects mute", audioBtn.getAttribute("aria-pressed") === "false");
      window.audioEngine.setMuted(false);
      check("audio: setMuted false restores volume", !window.audioEngine.isMuted() && window.audioEngine.getParams().masterVolume > 0);

      // 20. Audio modulation with flight speed & throttle
      resetScene(0);
      requestEngage();
      const pIdle = window.audioEngine.getParams().engineFreq;
      helm.lever = 1.0;
      for (let i = 0; i < 30; i++) {
        stepFrame(0.5 + i * 0.016, 0.016);
      }
      const pFast = window.audioEngine.getParams().engineFreq;
      check("audio: engine frequency increases with speed/throttle", pFast > pIdle, `idle: ${pIdle}, fast: ${pFast}`);
      check("audio: full throttle engine gain within bounds", window.audioEngine.getParams().engineGain > 0.3);

      // 21. Visual & Audio Shield impact feedback and directional wash
      resetScene(0);
      requestEngage();
      const sFlashEl = document.getElementById("shieldFlash");
      check("visual: shieldFlash wash element exists", !!sFlashEl);

      // Starboard entity impact (nx > 0) should direct flash towards right (sx > 50%)
      const starboardEntity = makeEntity({ model: "galaxy" });
      starboardEntity.pos = [10, 0, 0];
      notifyImpact(world.entities[0], starboardEntity, 2.5, 1, 0, 0);
      check("impact: world.lastImpact recorded", !!world.lastImpact && world.lastImpact.speed === 2.5);
      check("impact: audio registered impact speed", window.audioEngine.getParams().lastImpactSpeed === 2.5);
      check("visual: shield flash wash triggered", parseFloat(sFlashEl.style.opacity) > 0.3);
      const starX = parseFloat(sFlashEl.style.getPropertyValue("--shield-x"));
      check("visual: starboard impact maps to right side sx > 50%", starX > 50, `sx: ${starX}`);
      check("camera-shake: impact induces trauma", getCameraShakeTrauma() > 0.3, `trauma: ${getCameraShakeTrauma()}`);

      // Sub-threshold scraping contact (< 0.08) should not add excessive trauma or overwrite flash
      resetCameraShake();
      notifyImpact(world.entities[0], "planet", 0.03, 1, 0, 0);
      check("impact: scraping contact ignored for shake", getCameraShakeTrauma() === 0, `trauma: ${getCameraShakeTrauma()}`);

      // 22. Camera shake & shield flash decay over time
      addCameraShake(0.7);
      triggerShieldFlash(2.5, [1, 0, 0]);
      for (let i = 0; i < 40; i++) {
        stepFrame(2.0 + i * 0.016, 0.016);
        updateWashes(2.0 + i * 0.016, world.entities[0], 0.016);
      }
      check("camera-shake: trauma decays to zero", getCameraShakeTrauma() === 0, `trauma: ${getCameraShakeTrauma()}`);
      check("visual: shield flash decays to zero opacity", parseFloat(sFlashEl.style.opacity) === 0);

      // 23. Warp sequence: charge whine -> jump whoosh -> drone & camera shake
      resetScene(0);
      requestEngage();
      helm.toggleWarp = true;
      stepFrame(0.1, 0.016);
      check("warp-audio: charge state activates whine", world.entities[0].warp.state === "charge" && window.audioEngine.getParams().warpChargeGain > 0);
      const chargeFreq0 = window.audioEngine.getParams().warpChargeFreq;

      // Advance partially through warp charge (~0.5s into the 1.2s charge)
      for (let i = 0; i < 30; i++) {
        stepFrame(0.12 + i * 0.016, 0.016);
      }
      const chargeFreq1 = window.audioEngine.getParams().warpChargeFreq;
      check("warp-audio: charge pitch rises monotonically", chargeFreq1 > chargeFreq0, `f0: ${chargeFreq0}, f1: ${chargeFreq1}`);

      // Complete charge and step into warp jump (past 1.2s)
      for (let i = 0; i < 60; i++) {
        stepFrame(0.65 + i * 0.016, 0.016);
      }
      check("warp: ship reaches warp on", world.entities[0].warp.state === "on");
      check("warp-audio: subspace drone gain active in warp", window.audioEngine.getParams().warpDroneGain > 0.2);
      check("warp-audio: jump telemetry recorded", window.audioEngine.getParams().lastWarpJumpTime > 0);
      check("camera-shake: single-trigger warp trauma bounded", getCameraShakeTrauma() <= 0.70, `trauma: ${getCameraShakeTrauma()}`);

      // Dropout transition: toggle warp off and verify dropout sound
      helm.toggleWarp = true;
      stepFrame(1.8, 0.016);
      check("warp: ship dropped out of warp", world.entities[0].warp.state === "off");
      check("warp-audio: dropout telemetry recorded", window.audioEngine.getParams().lastWarpDropoutTime > 0);

      // Return to orbit via resetScene: verify audio engine clean reset
      resetScene(2.0);
      check("audio: resetScene clears warp drone", window.audioEngine.getParams().warpDroneGain === 0);
    } catch (err) {
      out.push("ERROR " + err.stack);
    }
    document.getElementById("out").textContent = out.join("\n");
  }

  window.addEventListener("DOMContentLoaded", runTests);
  </script>
</body>
</html>
