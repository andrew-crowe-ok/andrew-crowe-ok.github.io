<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>UNM CS 412/512 HW3</title>
  <style>
    body {
      background: #111;
      color: #ccc;
      font-family: monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 15px;
    }

    canvas {
      border: 1px solid #444;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <canvas id="glcanvas" width="750" height="560"></canvas>
  <div class="controls">
    <div style="display: flex; align-items: center; gap: 10px;">
      <label for="leverSlider" style="width: 130px; text-align: right;">Section 1 (X):</label>
      <input type="range" id="leverSlider" min="-45" max="45" step="1" value="0" style="width: 240px;">
      <span id="leverValue" style="width: 45px;">0°</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <label for="joint1Slider" style="width: 130px; text-align: right;">Section 2 (Z):</label>
      <input type="range" id="joint1Slider" min="-90" max="90" step="1" value="0" style="width: 240px;">
      <span id="joint1Value" style="width: 45px;">0°</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
      <button id="spinBtn" style="padding: 6px 12px; cursor: pointer; border-radius: 4px; background: #444; color: #fff; border: 1px solid #666;">Toggle Spin</button>
    </div>
  </div>

  <!-- Vertex shader -->
  <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
precision mediump float;
in vec3 aPosition;
in vec3 aColor;

uniform float uTime;
uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;
uniform mat4 uModelTransformationMatrix;

out vec3 vColor;

void main() {
  gl_Position = uProjectionMatrix * uModelViewMatrix * uModelTransformationMatrix * vec4(aPosition, 1.0);
  vColor = aColor;
}
</script>
  <!-- Fragment Shader -->
  <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision mediump float;
in vec3 vColor;
uniform float uTime;
uniform float uAlpha;

out vec4 fragColor;

void main() {
  fragColor = vec4(vColor, 1.0);
}
</script>

  <script src="primitives.js?v=3"></script>
  <script src="transformations.js?v=3"></script>

  <script>
    function createShader(gl, type, source) {
      let shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      let vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      let fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      let prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }
      return prog;
    }

    // WebGL setup
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) alert("WebGL2 not supported");

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    let program, posLoc, colorLoc, timeLoc, uMVM, uPM, uMTM, uAlphaLoc;
    let hemisphereBuffers, cuboidBuffers, sphereBuffers, prismBuffers;
    let sceneObjects = [];
    let vbo, nbo, ibo;

    // Buffers
    function createMeshBuffers(gl, posData, colorData, indexData) {
      let vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, posData, gl.STATIC_DRAW);

      let nbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, nbo);
      gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);

      let ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexData, gl.STATIC_DRAW);

      return { vbo, nbo, ibo, indexCount: indexData.length };
    }

    function initBuffers() {
      const hemiData = createHemisphere('top', 1.0, 20, 20);
      hemisphereBuffers = createMeshBuffers(
        gl, 
        hemiData.positions, 
        hemiData.colors, 
        hemiData.indices
      );

      const cuboidData = createCuboid(2.0, 2.0, 2.0);
      cuboidBuffers = createMeshBuffers(
        gl,
        cuboidData.positions,
        cuboidData.colors, 
        cuboidData.indices
      );

      const sphereData = createSphere(1.0, 20, 20);
      sphereBuffers = createMeshBuffers(
        gl,
        sphereData.positions,
        sphereData.colors,
        sphereData.indices
      );

      const prismData = createTrapezoidalPrism();
      const tintedColors = new Float32Array(prismData.colors.length);
      for (let i = 0; i < prismData.colors.length; i += 3) {
        // Gold/bronze tint to contrast with the plane
        tintedColors[i] = Math.min(1.0, prismData.colors[i] * 1.8);
        tintedColors[i+1] = Math.min(1.0, prismData.colors[i+1] * 1.4);
        tintedColors[i+2] = prismData.colors[i+2] * 0.5;
      }
      prismBuffers = createMeshBuffers(
        gl,
        prismData.positions,
        tintedColors,
        prismData.indices
      );
    }
    initBuffers();

    function initShaderProgram() {
      try {
        const vsSource = document.getElementById("vertex-shader").textContent.trim();
        const fsSource = document.getElementById("fragment-shader").textContent.trim();
        let newProgram = createProgram(gl, vsSource, fsSource);
        program = newProgram;
        gl.useProgram(program);
        posLoc = gl.getAttribLocation(program, "aPosition");
        colorLoc = gl.getAttribLocation(program, "aColor");
        timeLoc = gl.getUniformLocation(program, "uTime");
        uMVM = gl.getUniformLocation(program, "uModelViewMatrix");
        uPM = gl.getUniformLocation(program, "uProjectionMatrix");
        uMTM = gl.getUniformLocation(program, "uModelTransformationMatrix");
        uAlphaLoc = gl.getUniformLocation(program, "uAlpha");
      } catch (e) {
        console.error(e);
      }
    }
    initShaderProgram();

    // Mouse and keyboard interactions
    let mouseDown = false, lastX, lastY, sceneRotX = 0.35, sceneRotY = 0;
    let camX = 0, camY = -1.6, camZ = -8;

    canvas.addEventListener('mousedown', e => { mouseDown = true; lastX = e.clientX; lastY = e.clientY; });
    canvas.addEventListener('mouseup', () => mouseDown = false);
    canvas.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      let dx = e.clientX - lastX;
      sceneRotY += dx * 0.01;
      lastX = e.clientX; lastY = e.clientY;
    });

    document.addEventListener('keydown', e => {
      const step = 0.2;
      switch (e.key) {
        case 'ArrowUp': camY -= step; break;
        case 'ArrowDown': camY += step; break;
        case 'ArrowLeft': camX += step; break;
        case 'ArrowRight': camX -= step; break;
        case 'w': camZ += step; break;
        case 's': camZ -= step; break;
      }
    });


    // Projection setup
    let fov = Math.PI / 4, aspect = canvas.width / canvas.height, zNear = 0.1, zFar = 100;

    let orthoSize = 4.8;

    // Perspective and Orthographic projection
    let projPerspective = perspective(fov, aspect, zNear, zFar);

    let projOrtho = matMul(
    box2Cube(-orthoSize * aspect, orthoSize * aspect, -orthoSize, orthoSize, zNear, zFar),
    flipZ()
    );
    let proj = projOrtho;

    let startTime = Date.now();
    let lastFrameTime = startTime;
    let isSpinning = false;
    let spinAngle = 0;

    const spinBtn = document.getElementById("spinBtn");
    if (spinBtn) {
      spinBtn.addEventListener("click", () => {
        isSpinning = !isSpinning;
      });
    }

    const leverSlider = document.getElementById("leverSlider");
    const leverVal = document.getElementById("leverValue");
    if (leverSlider && leverVal) {
      leverSlider.addEventListener("input", (e) => {
        leverVal.textContent = e.target.value + "°";
      });
    }

    const joint1Slider = document.getElementById("joint1Slider");
    const joint1Val = document.getElementById("joint1Value");
    if (joint1Slider && joint1Val) {
      joint1Slider.addEventListener("input", (e) => {
        joint1Val.textContent = e.target.value + "°";
      });
    }

    function mat4RotateZ(matrix, angle) {
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      const result = new Float32Array(matrix);
      const m0 = matrix[0], m1 = matrix[1], m2 = matrix[2],  m3 = matrix[3];
      const m4 = matrix[4], m5 = matrix[5], m6 = matrix[6],  m7 = matrix[7];
      result[0] = m0 * c + m4 * s;
      result[1] = m1 * c + m5 * s;
      result[2] = m2 * c + m6 * s;
      result[3] = m3 * c + m7 * s;
      result[4] = m4 * c - m0 * s;
      result[5] = m5 * c - m1 * s;
      result[6] = m6 * c - m2 * s;
      result[7] = m7 * c - m3 * s;
      return result;
    }

    function drawPrimitive(buffers, modelMatrix) {
      if (!buffers) return;
      gl.uniformMatrix4fv(uMTM, false, modelMatrix);

      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.vbo);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.nbo);
      gl.enableVertexAttribArray(colorLoc);
      gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.ibo);
      gl.drawElements(gl.TRIANGLES, buffers.indexCount, gl.UNSIGNED_SHORT, 0);
    }

    function render() {
      try {
        if (!program) return;
        gl.useProgram(program);
        gl.enable(gl.DEPTH_TEST);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.viewport(0, 0, canvas.width, canvas.height);

        // rotation matrices
        let cx = Math.cos(sceneRotY), sx = Math.sin(sceneRotY);
        let cy = Math.cos(sceneRotX), sy = Math.sin(sceneRotX);
        let rotX = [1, 0, 0, 0, 0, cy, sy, 0, 0, -sy, cy, 0, 0, 0, 0, 1];
        let rotY = [cx, 0, -sx, 0, 0, 1, 0, 0, sx, 0, cx, 0, 0, 0, 0, 1];
        let sceneRotation = multiplyMat4(rotY, rotX);
        
        const hemisphereRotation = 0.0;
        const s1Deg = parseFloat(leverSlider ? leverSlider.value : 0) || 0;
        const s1Rad = s1Deg * Math.PI / 180.0;
        const s2Deg = parseFloat(joint1Slider ? joint1Slider.value : 0) || 0;
        const s2Rad = s2Deg * Math.PI / 180.0;

        let modelViewMatrix = mat4Identity();
        let now = Date.now();
        let deltaTime = now - startTime;
        let frameDelta = now - lastFrameTime;
        lastFrameTime = now;

        if (isSpinning) {
          spinAngle += frameDelta * 0.003;
        }

        // camera translation
        modelViewMatrix = mat4Translate(modelViewMatrix, [camX, camY, camZ]);
        
        //set time in seconds
        gl.uniform1f(timeLoc, deltaTime/1000.0);
        gl.uniformMatrix4fv(uPM, false, proj);
        gl.uniformMatrix4fv(uMVM, false, modelViewMatrix);

        function drawBase(parentMatrix) {
          let model = mat4Translate(parentMatrix, [0, 0, 0]);
          model = mat4RotateY(model, hemisphereRotation);
        
          drawPrimitive(hemisphereBuffers, mat4Scale(model, [1, 1, 1]));

          drawFirstSection(model);
        }

        function drawFirstSection(parentMatrix){
          let model = mat4RotateX(parentMatrix, s1Rad);
          model = mat4Translate(model, [0, 1.5, 0]);
        
          drawPrimitive(cuboidBuffers, mat4Scale(model, [0.15, 1.25, 0.15]));

          drawFirstJoint(model);
        }

        function drawFirstJoint(parentMatrix){
          let model = mat4Translate(parentMatrix, [0, 1.5, 0]);
          model = mat4RotateZ(model, hemisphereRotation);
        
          drawPrimitive(sphereBuffers, mat4Scale(model, [0.35, 0.35, 0.35]));

          drawSecondSection(model);
        }

        function drawSecondSection(parentMatrix) {
          let model = mat4RotateZ(parentMatrix, s2Rad);
          model = mat4Translate(model, [0, 1.5, 0]);

          drawPrimitive(cuboidBuffers, mat4Scale(model, [0.15, 1.25, 0.15]));

          drawSecondJoint(model);
        }

        function drawSecondJoint(parentMatrix) {
          let model = mat4Translate(parentMatrix, [0, 1.5, 0]);
          
          drawPrimitive(sphereBuffers, mat4Scale(model, [0.35, 0.35, 0.35]));

          drawThirdSection(model);
        }

        function drawThirdSection(parentMatrix) {
          let model = mat4Translate(parentMatrix, [0, 0.35, 0]);
          model = mat4RotateY(model, spinAngle);
          
          drawPrimitive(cuboidBuffers, mat4Scale(model, [0.8, 0.05, 0.8]));

          let prismModel = mat4Translate(model, [0, 0.20, 0]);
          drawPrimitive(prismBuffers, mat4Scale(prismModel, [0.8, 0.15, 0.8]));
        }

        drawBase(sceneRotation);
      } catch (err) {
        console.error("Render loop error:", err);
      }
    }

    // Initialize when page loads
    window.onload = function () {
      initShaderProgram();
      setInterval(render, 30);
    }

  </script>
</body>

</html>
