<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texture Mapping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: 110, 200, 255;          /* warp-field blue, as rgb triplet */
      --ink: #e4f6ff;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

    /* Full-screen washes driven from main.js: the white-blue flash at the jump
       to warp, and the fade through black around a reset */
    .wash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
    #warpFlash {
      background: radial-gradient(ellipse at 50% 45%, #fff 0%, rgba(200, 235, 255, 0.85) 22%,
                  rgba(var(--glow), 0.35) 55%, rgba(var(--glow), 0) 80%);
      mix-blend-mode: screen;
    }
    #fade { background: #000; opacity: 1; }

    #engageButton {
      position: fixed; left: 50%; bottom: max(7vh, 28px);
      transform: translateX(-50%);
      padding: 0.95em 2.6em 0.95em calc(2.6em + 0.42em);   /* last letter's tracking */
      font: 600 clamp(15px, 1.6vw, 21px) / 1 "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(14, 34, 58, 0.72), rgba(4, 12, 24, 0.78));
      border: 1px solid rgba(var(--glow), 0.7);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(var(--glow), 0.35), inset 0 0 14px rgba(var(--glow), 0.18);
      text-shadow: 0 0 8px rgba(var(--glow), 0.8);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; outline: none;
      animation: idle 2.8s ease-in-out infinite;
      transition: opacity 0.45s ease, transform 0.45s ease, border-color 0.2s, background 0.2s;
    }
    #engageButton:hover, #engageButton:focus-visible {
      border-color: rgba(var(--glow), 1);
      background: linear-gradient(180deg, rgba(24, 56, 92, 0.8), rgba(6, 18, 34, 0.85));
    }
    #engageButton:active { transform: translateX(-50%) scale(0.96); }
    /* Engaged: the button bows out of the way until the scene resets */
    #engageButton:disabled {
      opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.94);
      pointer-events: none; animation: none;
    }
    @keyframes idle {
      0%, 100% { box-shadow: 0 0 12px rgba(var(--glow), 0.30), inset 0 0 12px rgba(var(--glow), 0.15); }
      50%      { box-shadow: 0 0 26px rgba(var(--glow), 0.60), inset 0 0 18px rgba(var(--glow), 0.28); }
    }
    @media (prefers-reduced-motion: reduce) { #engageButton { animation: none; } }
  </style>
</head>

<body>
  <canvas id="glcanvas"></canvas>
  <div id="warpFlash" class="wash"></div>
  <div id="fade" class="wash"></div>
  <button id="engageButton">Engage</button>

  <script src="transforms.js"></script>
  <script src="models.js"></script>
  <script src="textures.js"></script>
  <script src="cradle.js"></script>
  <script src="ship.js"></script>
  <script src="camera.js"></script>
  <script src="stars.js"></script>
  <script src="scene.js"></script>
  <script src="main.js"></script>
</body>

</html>
