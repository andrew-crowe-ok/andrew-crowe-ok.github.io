<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ray Tracing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: 110, 200, 255;          /* warp-field blue, as rgb triplet */
      --ink: #e4f6ff;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

    /* Full-screen washes driven from main.js: the white-blue flash at the jump
       to warp, and the fade through black around a reset */
    .wash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
    #warpFlash {
      background: radial-gradient(ellipse at 50% 45%, #fff 0%, rgba(200, 235, 255, 0.85) 22%,
                  rgba(var(--glow), 0.35) 55%, rgba(var(--glow), 0) 80%);
      mix-blend-mode: screen;
    }
    #fade { background: #000; opacity: 1; }
    #error {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(520px, calc(100vw - 32px)); box-sizing: border-box; padding: 1em 1.2em;
      font: 14px / 1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: rgba(40, 10, 14, 0.85); border: 1px solid rgba(255, 110, 110, 0.6);
      border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    #error[hidden] { display: none; }

    #engageButton {
      position: fixed; left: 50%; bottom: max(7vh, 28px);
      transform: translateX(-50%);
      padding: 0.95em 2.6em 0.95em calc(2.6em + 0.42em);   /* last letter's tracking */
      font: 600 clamp(15px, 1.6vw, 21px) / 1 "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(14, 34, 58, 0.72), rgba(4, 12, 24, 0.78));
      border: 1px solid rgba(var(--glow), 0.7);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(var(--glow), 0.35), inset 0 0 14px rgba(var(--glow), 0.18);
      text-shadow: 0 0 8px rgba(var(--glow), 0.8);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; outline: none;
      animation: idle 2.8s ease-in-out infinite;
      transition: opacity 0.45s ease, transform 0.45s ease, translate 0.45s ease,
                  border-color 0.2s, background 0.2s;
    }
    /* Held back until main.js reveals it (see REVEAL), then a slow rise into
       view. The rise uses `translate` so it stays apart from the press and
       bow-out transforms, which keep their quick timing. */
    #engageButton:not(.revealed) {
      opacity: 0; translate: 0 18px; visibility: hidden; pointer-events: none;
    }
    #engageButton.revealed:not(:disabled) {
      transition: opacity 3s cubic-bezier(0.45, 0, 0.25, 1),
                  translate 3.6s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s ease, border-color 0.2s, background 0.2s;
    }
    #engageButton:hover, #engageButton:focus-visible {
      border-color: rgba(var(--glow), 1);
      background: linear-gradient(180deg, rgba(24, 56, 92, 0.8), rgba(6, 18, 34, 0.85));
    }
    #engageButton:active { transform: translateX(-50%) scale(0.96); }
    /* Engaged: the button bows out of the way until the scene resets */
    #engageButton:disabled {
      opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.94);
      pointer-events: none; animation: none;
    }
    @keyframes idle {
      0%, 100% { box-shadow: 0 0 12px rgba(var(--glow), 0.30), inset 0 0 12px rgba(var(--glow), 0.15); }
      50%      { box-shadow: 0 0 26px rgba(var(--glow), 0.60), inset 0 0 18px rgba(var(--glow), 0.28); }
    }
    @media (prefers-reduced-motion: reduce) {
      #engageButton { animation: none; }
      #engageButton:not(.revealed) { translate: none; }
    }

    /* Ray tracer controls: a small glass panel in the corner, in the Engage
       button's style, folded away with its summary */
    #controls {
      position: fixed; left: 16px; top: 16px; width: min(250px, calc(100vw - 32px));
      box-sizing: border-box; padding: 0.7em 0.95em;
      font: 500 12px / 1.3 "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(180deg, rgba(14, 34, 58, 0.62), rgba(4, 12, 24, 0.7));
      border: 1px solid rgba(var(--glow), 0.45); border-radius: 12px;
      box-shadow: 0 0 12px rgba(var(--glow), 0.2);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #controls summary {
      cursor: pointer; list-style: none; user-select: none;
      font: 600 11px / 1 "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.25em; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(var(--glow), 0.8);
    }
    #controls summary::-webkit-details-marker { display: none; }
    #controls summary::after { content: "+"; float: right; letter-spacing: 0; }
    #controls[open] summary::after { content: "\2212"; }
    #controls[open] summary { margin-bottom: 0.7em; }
    #controls .row { display: grid; grid-template-columns: 1fr auto; gap: 0.15em 0.5em; margin: 0.5em 0; }
    #controls .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: rgb(var(--glow)); }
    #controls output { font-variant-numeric: tabular-nums; opacity: 0.8; }
    #controls .checks { display: flex; flex-wrap: wrap; gap: 0.5em 1.1em; margin-top: 0.7em; }
    #controls .checks label { display: flex; align-items: center; gap: 0.4em; cursor: pointer; }
    #controls .checks input { margin: 0; accent-color: rgb(var(--glow)); }

    /* Diagnostic stats / telemetry overlay */
    #statsOverlay {
      position: fixed; right: 16px; top: 16px; width: min(240px, calc(100vw - 32px));
      box-sizing: border-box; padding: 0.7em 0.95em;
      font: 500 12px / 1.35 "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(180deg, rgba(14, 34, 58, 0.72), rgba(4, 12, 24, 0.8));
      border: 1px solid rgba(var(--glow), 0.45); border-radius: 12px;
      box-shadow: 0 0 14px rgba(var(--glow), 0.22);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      user-select: none; pointer-events: none;
      z-index: 10;
    }
    #statsOverlay[hidden] { display: none; }
    #statsOverlay .stats-header {
      display: flex; justify-content: space-between; align-items: center;
      font: 600 11px / 1 "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.25em; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(var(--glow), 0.8);
      margin-bottom: 0.55em; padding-bottom: 0.35em;
      border-bottom: 1px solid rgba(var(--glow), 0.25);
    }
    #statsOverlay .stats-status {
      font-size: 9px; letter-spacing: 0.15em; opacity: 0.75;
      padding: 0.15em 0.4em; border-radius: 4px;
      background: rgba(var(--glow), 0.15); border: 1px solid rgba(var(--glow), 0.3);
    }
    #statsOverlay .stats-status.warp {
      color: #fff; background: rgba(255, 160, 60, 0.25);
      border-color: rgba(255, 180, 80, 0.6);
      text-shadow: 0 0 8px rgba(255, 180, 80, 0.8);
    }
    #statsOverlay button#statsClose {
      pointer-events: auto;
      background: none; border: none; padding: 0 0.2em; margin-left: 0.4em;
      font: 600 13px / 1 sans-serif; color: var(--ink);
      opacity: 0.6; cursor: pointer; border-radius: 4px;
    }
    #statsOverlay button#statsClose:hover { opacity: 1; color: #fff; }
    #statsOverlay .stat-row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 0.5em; margin: 0.2em 0;
    }
    #statsOverlay .stat-label {
      opacity: 0.72; font-size: 11px;
    }
    #statsOverlay .stat-val {
      font-variant-numeric: tabular-nums; font-weight: 600; text-align: right;
    }
    #statsOverlay .stat-val.accent {
      color: #7ef5ff; text-shadow: 0 0 6px rgba(var(--glow), 0.6);
    }
    #statsOverlay .stat-val.warn {
      color: #ffd166;
    }
    #statsOverlay .stat-val.alert {
      color: #ff6b6b;
    }
    #statsOverlay .stats-graph {
      width: 100%; height: 28px; display: block; margin-top: 0.5em;
      border-radius: 6px; background: rgba(0, 10, 20, 0.55);
      border: 1px solid rgba(var(--glow), 0.2);
    }
    #statsOverlay .stats-gpu-info {
      font-size: 9px; opacity: 0.55; margin-top: 0.4em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: right;
    }
    @media (max-width: 560px) {
      #statsOverlay {
        top: auto;
        bottom: calc(max(7vh, 28px) + 54px);
        right: 16px;
        left: 16px;
        width: auto;
      }
    }
  </style>
</head>

<body>
  <canvas id="glcanvas"></canvas>
  <div id="warpFlash" class="wash"></div>
  <div id="fade" class="wash"></div>
  <div id="error" role="alert" hidden></div>
  <button id="engageButton">Engage</button>

  <details id="controls" open>
    <summary>Ray tracer</summary>
    <label class="row">Bounces <output for="bounces"></output>
      <input type="range" id="bounces" min="0" max="6" step="1" value="3"></label>
    <label class="row">Sun <output for="sun"></output>
      <input type="range" id="sun" min="0" max="2" step="0.05" value="1"></label>
    <label class="row">Fill light <output for="fill"></output>
      <input type="range" id="fill" min="0" max="4" step="0.05" value="1"></label>
    <label class="row">Nav light <output for="nav"></output>
      <input type="range" id="nav" min="0" max="4" step="0.05" value="1"></label>
    <label class="row">Shininess <output for="shininess"></output>
      <input type="range" id="shininess" min="-2" max="2" step="0.1" value="0"></label>
    <label class="row">Glass index of refraction <output for="ior"></output>
      <input type="range" id="ior" min="1" max="2.4" step="0.01" value="1.5"></label>
    <div class="checks">
      <label><input type="checkbox" id="shadows" checked> Shadows</label>
      <label><input type="checkbox" id="attenuation" checked> Attenuation</label>
      <label><input type="checkbox" id="stats"> Stats</label>
    </div>
  </details>

  <div id="statsOverlay" hidden>
    <div class="stats-header">
      <span>Telemetry</span>
      <div style="display: flex; align-items: center; gap: 0.3em;">
        <span id="statsFlightPhase" class="stats-status">ORBIT</span>
        <button id="statsClose" title="Hide stats (key: I)" aria-label="Close stats">&times;</button>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Frame Rate</span>
      <span id="statFps" class="stat-val accent">-- FPS</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Latency / Frame</span>
      <span id="statLatency" class="stat-val">-- ms</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">CPU Render</span>
      <span id="statCpu" class="stat-val">-- ms</span>
    </div>
    <div id="statGpuRow" class="stat-row" hidden>
      <span class="stat-label">GPU Render</span>
      <span id="statGpu" class="stat-val">-- ms</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Resolution</span>
      <span id="statRes" class="stat-val">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Viewport / Scale</span>
      <span id="statScale" class="stat-val">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Primitives</span>
      <span id="statPrims" class="stat-val">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Ray Bounces</span>
      <span id="statBounces" class="stat-val">--</span>
    </div>
    <canvas id="statsGraph" class="stats-graph" width="200" height="28"></canvas>
    <div id="statsGpuInfo" class="stats-gpu-info"></div>
  </div>

  <!-- ?v= changes with each deploy, so a browser never runs a cached script
       from the last one alongside new ones -->
  <script src="transforms.js?v=4"></script>
  <script src="raytrace.js?v=4"></script>
  <script src="textures.js?v=4"></script>
  <script src="ship.js?v=4"></script>
  <script src="camera.js?v=4"></script>
  <script src="scene.js?v=4"></script>
  <script src="main.js?v=4"></script>
</body>

</html>
