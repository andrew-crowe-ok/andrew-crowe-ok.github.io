<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ray Tracing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="textures/antelope.webp" media="not all and (pointer: coarse)">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="textures/antelope-mobile.webp" media="(pointer: coarse)">
  <style>
    :root {
      --glow: 110, 200, 255;          /* warp-field blue, as rgb triplet */
      --ink: #e4f6ff;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
                 overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    /* dvh tracks the phone's address bar as it slides in and out; touch-action
       hands every gesture on the canvas to main.js rather than the browser */
    #glcanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
                display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

    /* Full-screen washes driven from main.js: the white-blue flash at the jump
       to warp, and the fade through black around a reset */
    .wash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
    #warpFlash {
      background: radial-gradient(ellipse at 50% 45%, #fff 0%, rgba(200, 235, 255, 0.85) 22%,
                  rgba(var(--glow), 0.35) 55%, rgba(var(--glow), 0) 80%);
      mix-blend-mode: screen;
    }
    #fade { background: #000; opacity: 1; }
    #error {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(520px, calc(100vw - 32px)); box-sizing: border-box; padding: 1em 1.2em;
      font: 14px / 1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: rgba(40, 10, 14, 0.85); border: 1px solid rgba(255, 110, 110, 0.6);
      border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    #error[hidden] { display: none; }

    #engageButton {
      position: fixed; left: 50%; bottom: max(7vh, 28px, calc(env(safe-area-inset-bottom) + 16px));
      transform: translateX(-50%);
      padding: 0.95em 2.6em 0.95em calc(2.6em + 0.42em);   /* last letter's tracking */
      font: 600 clamp(15px, 1.6vw, 21px) / 1 "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(14, 34, 58, 0.72), rgba(4, 12, 24, 0.78));
      border: 1px solid rgba(var(--glow), 0.7);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(var(--glow), 0.35), inset 0 0 14px rgba(var(--glow), 0.18);
      text-shadow: 0 0 8px rgba(var(--glow), 0.8);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; outline: none;
      animation: idle 2.8s ease-in-out infinite;
      transition: opacity 0.45s ease, transform 0.45s ease, translate 0.45s ease,
                  border-color 0.2s, background 0.2s;
    }
    /* Held back until main.js reveals it (see REVEAL), then a slow rise into
       view. The rise uses `translate` so it stays apart from the press and
       bow-out transforms, which keep their quick timing. */
    #engageButton:not(.revealed) {
      opacity: 0; translate: 0 18px; visibility: hidden; pointer-events: none;
    }
    #engageButton.revealed:not(:disabled) {
      transition: opacity 3s cubic-bezier(0.45, 0, 0.25, 1),
                  translate 3.6s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s ease, border-color 0.2s, background 0.2s;
    }
    #engageButton:hover, #engageButton:focus-visible {
      border-color: rgba(var(--glow), 1);
      background: linear-gradient(180deg, rgba(24, 56, 92, 0.8), rgba(6, 18, 34, 0.85));
    }
    #engageButton:active { transform: translateX(-50%) scale(0.96); }
    /* Engaged: the button bows out of the way until the scene resets */
    #engageButton:disabled {
      opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.94);
      pointer-events: none; animation: none;
    }
    @keyframes idle {
      0%, 100% { box-shadow: 0 0 12px rgba(var(--glow), 0.30), inset 0 0 12px rgba(var(--glow), 0.15); }
      50%      { box-shadow: 0 0 26px rgba(var(--glow), 0.60), inset 0 0 18px rgba(var(--glow), 0.28); }
    }
    @media (prefers-reduced-motion: reduce) {
      #engageButton { animation: none; }
      #engageButton:not(.revealed) { translate: none; }
    }

    /* Ray tracer controls and live GLSL editor: small glass panels in the
       top corners, in the Engage button's style, folded away with summary */
    #controls, #shaderBox {
      position: fixed; top: calc(16px + env(safe-area-inset-top));
      max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow-y: auto; overscroll-behavior: contain;
      box-sizing: border-box; padding: 0.7em 0.95em;
      font: 500 12px / 1.3 "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(180deg, rgba(14, 34, 58, 0.62), rgba(4, 12, 24, 0.7));
      border: 1px solid rgba(var(--glow), 0.45); border-radius: 12px;
      box-shadow: 0 0 12px rgba(var(--glow), 0.2);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #controls {
      left: calc(16px + env(safe-area-inset-left));
      width: min(250px, calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
    }
    #shaderBox {
      right: calc(16px + env(safe-area-inset-right));
      max-width: calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right));
    }
    #shaderBox[open] { width: min(560px, calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right))); }
    #controls summary, #shaderBox summary {
      display: flex; align-items: center; justify-content: space-between; gap: 0.9em;
      white-space: nowrap;
      cursor: pointer; list-style: none; user-select: none;
      font: 600 11px / 1 "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.25em; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(var(--glow), 0.8);
    }
    #controls summary::-webkit-details-marker,
    #shaderBox summary::-webkit-details-marker { display: none; }
    #controls summary::after, #shaderBox summary::after {
      content: "+"; letter-spacing: 0;
    }
    #controls[open] summary::after, #shaderBox[open] summary::after { content: "\2212"; }
    #controls[open] summary, #shaderBox[open] summary { margin-bottom: 0.7em; }
    #controls .row { display: grid; grid-template-columns: 1fr auto; gap: 0.15em 0.5em; margin: 0.5em 0; }
    #controls .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: rgb(var(--glow)); }
    #controls .row select {
      grid-column: 1 / -1; width: 100%; margin: 0; padding: 0.2em 0.3em; font: inherit; color: var(--ink);
      background: rgba(8, 22, 40, 0.75); border: 1px solid rgba(var(--glow), 0.35); border-radius: 4px;
    }
    #perfHud {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: calc(16px + min(250px, calc(100vw - 32px)) + 12px + env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 2px;
      white-space: nowrap;
      pointer-events: none; user-select: none;
      font: 500 12px / 1.25 ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: rgba(228, 246, 255, 0.85);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.65);
    }
    /* Mobile and narrow screens: hide the GLSL editor, keep Ray tracer compact
       when folded, and pin the FPS/resolution readout to the top-right corner */
    @media (pointer: coarse), (max-width: 600px) {
      #shaderBox { display: none; }
      #controls {
        top: calc(12px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        width: auto;
        max-width: calc(100vw - 92px - env(safe-area-inset-left) - env(safe-area-inset-right));
        max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      #controls[open] {
        width: min(250px, calc(100vw - 92px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      }
      #perfHud {
        top: calc(12px + env(safe-area-inset-top));
        left: auto;
        right: calc(12px + env(safe-area-inset-right));
        align-items: flex-end;
        text-align: right;
      }
    }
    /* Finger-sized targets on touch screens */
    @media (pointer: coarse) {
      #controls { font-size: 14px; }
      #controls summary { padding: 0.4em 0; }
      #controls .row input[type=range] { height: 28px; }
      #controls .checks input { width: 20px; height: 20px; }
      #perfHud { top: calc(16px + env(safe-area-inset-top)); }
    }
    #controls output { font-variant-numeric: tabular-nums; opacity: 0.8; }
    #controls .checks { display: flex; flex-wrap: wrap; gap: 0.5em 1.1em; margin-top: 0.7em; }
    #controls .checks label { display: flex; align-items: center; gap: 0.4em; cursor: pointer; }
    #controls .checks input { margin: 0; accent-color: rgb(var(--glow)); }

    #shaderBox .tabs { display: flex; gap: 0.4em; margin-bottom: 0.45em; }
    #shaderBox button {
      font: 600 11px / 1.2 "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: rgba(8, 22, 40, 0.75); border: 1px solid rgba(var(--glow), 0.35);
      border-radius: 7px; padding: 0.42em 0.8em; cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    #shaderBox button:hover, #shaderBox button:focus-visible {
      border-color: rgba(var(--glow), 0.85);
      background: rgba(18, 44, 76, 0.85);
      outline: none;
    }
    #shaderBox .tab { flex: 1; text-align: center; opacity: 0.72; }
    #shaderBox .tab[aria-selected="true"] {
      opacity: 1; border-color: rgba(var(--glow), 0.9);
      background: rgba(20, 52, 90, 0.88);
      box-shadow: inset 0 0 10px rgba(var(--glow), 0.25);
    }
    #shaderHint {
      margin-bottom: 0.5em; padding: 0.4em 0.6em;
      font: 11px / 1.35 "Segoe UI", system-ui, sans-serif;
      color: rgba(212, 238, 255, 0.86);
      background: rgba(var(--glow), 0.08);
      border-left: 2px solid rgba(var(--glow), 0.55);
      border-radius: 0 6px 6px 0;
    }
    #shaderHint code {
      font: 10.5px / 1.2 ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      color: #ffd27d; background: rgba(0, 0, 0, 0.28);
      padding: 0.08em 0.32em; border-radius: 4px;
    }
    .editorShell {
      --code-font: 12px / 1.48 ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --code-pad-y: 9px;
      display: grid; grid-template-columns: auto 1fr;
      height: min(46vh, 360px); min-height: 180px;
      resize: vertical; overflow: hidden;
      background: rgba(2, 8, 18, 0.88);
      border: 1px solid rgba(var(--glow), 0.35); border-radius: 9px;
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.45);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .editorShell:focus-within {
      border-color: rgba(var(--glow), 0.9);
      box-shadow: 0 0 10px rgba(var(--glow), 0.2), inset 0 0 14px rgba(0, 0, 0, 0.45);
    }
    #shaderGutter {
      margin: 0; padding: var(--code-pad-y) 8px var(--code-pad-y) 9px;
      font: var(--code-font); text-align: right; user-select: none; overflow: hidden;
      color: rgba(var(--glow), 0.42); background: rgba(6, 18, 34, 0.55);
      border-right: 1px solid rgba(var(--glow), 0.16);
      font-variant-numeric: tabular-nums;
    }
    .editorWrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #shaderHighlight, #shaderEditor {
      position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
      box-sizing: border-box; padding: var(--code-pad-y) 11px;
      font: var(--code-font); tab-size: 2; white-space: pre;
      border: 0; letter-spacing: 0;
    }
    #shaderHighlight { pointer-events: none; overflow: hidden; color: var(--ink); }
    #shaderEditor {
      overflow: auto; resize: none; outline: none; background: transparent;
      color: transparent; caret-color: #ffffff; -webkit-text-fill-color: transparent;
      scrollbar-width: thin; scrollbar-color: rgba(var(--glow), 0.35) transparent;
    }
    #shaderEditor::selection { background: rgba(var(--glow), 0.28); }
    #shaderEditor::-webkit-scrollbar { width: 8px; height: 8px; }
    #shaderEditor::-webkit-scrollbar-thumb {
      background: rgba(var(--glow), 0.32); border-radius: 999px;
    }
    #shaderEditor::-webkit-scrollbar-track { background: transparent; }
    .tok-com { color: #6f8cad; font-style: italic; }
    .tok-kw  { color: #66c8ff; font-weight: 600; }
    .tok-ty  { color: #6be5c8; }
    .tok-bi  { color: #ffd27d; }
    .tok-num { color: #ff9e80; }
    .tok-pp  { color: #c59eff; }

    #shaderBox .actions {
      display: flex; align-items: center; gap: 0.5em; margin-top: 0.55em;
    }
    #shaderApply { border-color: rgba(var(--glow), 0.65); }
    #shaderApply.pending {
      border-color: rgba(var(--glow), 1);
      background: rgba(22, 62, 108, 0.88);
      box-shadow: 0 0 10px rgba(var(--glow), 0.32);
    }
    #shaderBox .shortcut { font-size: 11px; opacity: 0.55; }
    #shaderStatus {
      margin-left: auto; font-size: 11px; opacity: 0.75;
      font-variant-numeric: tabular-nums;
    }
    #shaderStatus.modified { color: #ffd98a; opacity: 0.95; }
    #shaderStatus.error { color: #ff8e8e; opacity: 1; }
    #shaderError {
      margin: 0.55em 0 0; padding: 0.55em 0.7em; max-height: 120px; overflow-y: auto;
      font: 11.5px / 1.4 ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      color: #ffd6d6; background: rgba(60, 12, 18, 0.82);
      border: 1px solid rgba(255, 110, 110, 0.55); border-radius: 8px;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    #shaderError[hidden] { display: none; }
  </style>
</head>

<body>
  <canvas id="glcanvas"></canvas>
  <div id="warpFlash" class="wash"></div>
  <div id="fade" class="wash"></div>
  <div id="error" role="alert" hidden></div>
  <button id="engageButton">Engage</button>

  <details id="controls" open>
    <summary>Ray tracer</summary>
    <label class="row">Bounces <output for="bounces"></output>
      <input type="range" id="bounces" min="0" max="6" step="1" value="3"></label>
    <label class="row">Mirror reflectivity <output for="mirrorReflect"></output>
      <input type="range" id="mirrorReflect" min="0" max="1" step="0.01" value="1"></label>
    <label class="row">Mirror warp <output for="mirrorWarp"></output>
      <input type="range" id="mirrorWarp" min="0" max="1" step="0.01" value="0"></label>
    <label class="row">Glass index of refraction <output for="ior"></output>
      <input type="range" id="ior" min="1" max="2.4" step="0.01" value="1.5"></label>
    <label class="row">Texture filtering
      <select id="filter">
        <option value="nearest">Nearest</option>
        <option value="linear">Linear</option>
        <option value="trilinear">Mipmap (trilinear)</option>
        <option value="aniso" selected>Mipmap + anisotropic</option>
      </select></label>
    <div class="checks">
      <label><input type="checkbox" id="shadows" checked> Shadows</label>
      <label><input type="checkbox" id="attenuation" checked> Attenuation</label>
      <label><input type="checkbox" id="showLod"> Show mip levels</label>
    </div>
  </details>
  <div id="perfHud" aria-live="off">
    <span id="fpsReadout">-- FPS</span>
    <span id="resReadout"></span>
  </div>

  <details id="shaderBox">
    <summary>GLSL Shader</summary>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-tab="shadeLocal" aria-selected="true">Lighting &amp; Shadows</button>
      <button type="button" class="tab" role="tab" data-tab="stepBounce" aria-selected="false">Bounces &amp; Glass</button>
    </div>
    <div id="shaderHint"></div>
    <div class="editorShell">
      <pre id="shaderGutter" aria-hidden="true"></pre>
      <div class="editorWrap">
        <pre id="shaderHighlight" aria-hidden="true"></pre>
        <textarea id="shaderEditor" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="GLSL shader block"></textarea>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="shaderApply" title="Compile and apply (Ctrl+Enter / Cmd+Enter)">Apply</button>
      <button type="button" id="shaderReset" title="Restore default GLSL for both tabs">Reset</button>
      <span class="shortcut">Ctrl/Cmd+Enter &middot; Tab</span>
      <span id="shaderStatus">Applied</span>
    </div>
    <pre id="shaderError" role="alert" hidden></pre>
  </details>

  <!-- ?v= changes with each deploy, so a browser never runs a cached script
       from the last one alongside new ones -->
  <script src="transforms.js?v=45"></script>
  <script src="raytrace.js?v=45"></script>
  <script src="textures.js?v=45"></script>
  <script src="ship.js?v=45"></script>
  <script src="camera.js?v=45"></script>
  <script src="scene.js?v=45"></script>
  <script src="main.js?v=45"></script>
</body>

</html>
